<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #first{

        height: 150px;
        width: 300px;
        text-align: center;
        color: white;
        background-color: teal;
        }
       
        #two{
            height: 50px;
            width: 600px;
            margin-top: 50px;
            margin-left: 200px;
            margin-right: 200px;
            text-align: center;
            padding-left: 250px;
            padding-right: 250px;
            padding-top: 40px;
            color: white;
            background-color: orange;
            
        }
        #three{
            height: 100px;
            width: 1400px;
            margin-left: 50px;
            margin-top: 50px;
            margin-right: 50px;
            text-align: center;
            padding-top: 40px;
            color: white;
            background-color: purple;
            
        }
    </style>
</head>
<body>
    <h1>CSS Height, width, margin and padding demo.</h1>

    <div id="first">
        Box 1
    </div>
    <div id="two">
        Box 2
    </div>
    <div id="three">
        Box 3
    </div>
</body>
</html>
