<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Create your Account</title>
</head>

<body class="bg-info-subtle d-flex align-items-center" style="min-height: 100vh;">
    <form action="" class="d-flex flex-column gap-1 bg-white p-4 rounded shadow-sm mx-auto" style="width: 500px;">
        <h1 class="text-center fw-bold">Create Your Account</h1>
        
        <div class="d-flex gap-3 w-100 p-3">
            <div class="form-group">
                <label for="firstname" class="form-label fw-semibold">Firstname</label>
                <div class="form-group">
                <input type="text" id="firstname" class="form-control" placeholder="Enter your firstname">
                </div>
            </div>
            <div class="form-group">
                <label for="lastname" class="form-label fw-semibold">Lastname</label>
                <div class="form-group">
                <input type="text" id="lastname" class="form-control" placeholder="Enter your lastname">
                </div>
            </div>
        </div>

        <div class="d-flex gap-3 w-100 p-3 align-items-end justify-content-center">
            <div class="form-group w-75">
                <label for="email" class="form-label fw-semibold">Email</label>
                <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
                </div>
            </div>
            <div class="form-group w-25">
                <button class="btn btn-primary text-center px-4">Verify</button>
            </div>
        </div>

        <div class="d-flex gap-3 w-100 p-3">
            <div class="form-group">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder="Enter your Password">
                </div>
            </div>
            <div class="form-group">
                <label for="confirm-password" class="form-label fw-semibold">Confirm Password</label>
                <div class="form-group">
                <input type="password" id="confirm-password" class="form-control" placeholder="Confirm your Password">
                </div>
            </div>
        </div>
        <div class="d-flex gap-3 w-100 p-3">
            <div class="form-group">
                <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
                <div class="form-group">
                <input type="tel" id="mobile" class="form-control" placeholder="Enter your Mobile Number">
                </div>
            </div>
            <div class="form-group">
                <label for="batch-code" class="form-label fw-semibold">Batch Code</label>
                <div class="form-group">
                <input type="text" id="batch-code" class="form-control" placeholder="Enter your Batch Code">
                </div>
            </div>
        </div>

        <button class="btn btn-primary w-100 mt-3">Create Account</button>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
