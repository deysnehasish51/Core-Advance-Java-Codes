<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Pricing Plans</title>
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container py-5">
        <h1 class="text-center fw-bold mb-5">Choose Your Plan</h1>
        <div class="row justify-content-center g-4">
            <div class="col-md-3">
                <div class="card p-4 text-center shadow-sm">
                    <h3 class="fs-3 mb-3">Basic</h3>
                    <h2 class="fs-1 mb-3">$9/mo</h2>
                    <span class="mb-4 d-block">Good for Starters</span>
                    <button class="btn btn-outline-primary w-100">Select</button>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center bg-primary text-white shadow-sm">
                    <h3 class="fs-3 mb-3">Pro</h3>
                    <h2 class="fs-1 mb-3">$29/mo</h2>
                    <span class="mb-4 d-block">Perfect for Professionals</span>
                    <button class="btn btn-light w-100">Select</button>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4 text-center shadow-sm">
                    <h3 class="fs-3 mb-3">Enterprise</h3>
                    <h2 class="fs-1 mb-3">$49/mo</h2>
                    <span class="mb-4 d-block">For Large Business</span>
                    <button class="btn btn-outline-primary w-100">Select</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
