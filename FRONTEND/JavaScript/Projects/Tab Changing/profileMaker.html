<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: aliceblue;
        }
        h1
        {
            text-align: center;
        }
        .container
        {
            border-radius: 20px;
            display: flex;
            justify-content: flex-start;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            width: 350px;
            height: auto;
            box-shadow: 3px 3px 15px grey;
            background-color: white;
        }
        #form
        {
            display: flex;
            justify-content: flex-start;
            flex-direction: column;
            gap: 10px;
        }
        label
        {
            font-size: 16px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: 600;
        }
        input{
            height: 35px;
            border-radius: 5px;
            border: 1px solid #111;
        }
        textarea{
            height: 60px;
            border-radius: 5px;
            border: 1px solid #111;
        }
        button
        {
            margin-top: 10px;
            height: 35px;
            font-size: 16px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 20px;
        }

        .profile
        {
            padding: 30px;
            width: 95%;
            height: 200px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        img{
            height: 100px;
            width: 100px;
            border: none;
            border-radius: 50%;
        }
        #newName
        {
            font-size: 24px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: center;
        }
        #bio
        {
            font-size: 14px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <form action="" id="form">
                    <h1>Create Your Profile</h1>
        <span>Fill out the form below to generate a profile card.</span>
        <label for="">Name</label>
        <input type="text" id="name">
        <label for="">Description</label>
        <textarea id="des"></textarea>
        <label for="">Avatar URL</label>
        <input type="url">

        <button id="btn">Create Profile</button>
        </form>

        <div class="profile" id="profile">
            <img src="" alt="" id="img" class="img">
            <h1  id="newName" class="newName"></h1>
            <p id="para" class="para"></p>
        </div>

    </div>
    <script>
        document.getElementById("btn").addEventListener('click',(e)=>
    {
        document.getElementById("profile").style.display="flex";
    })
    </script>
</body>
</html>
