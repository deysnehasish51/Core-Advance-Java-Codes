<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            position: relative;
        }

        #btn{
            position: absolute;
            left: 10%;
            top: 10%;
            height: 45px;
            width: 120px;
            border: none;
            border: 20px;
            border-radius: 20px;
            background-color: aquamarine;
            text-align: center;
            font-size: 18px;
        }

        #modal
        {
            width: 300px;
            height: 220px;
            padding: 30px;
            justify-content: flex-start;
            flex-direction: column;
            border: 2px solid black;
            box-shadow: 5px 5px 10px #111;
            border-radius: 20px;
            align-items: center;
            display: none;
            row-gap: 30px;
        }
        #btn-close
        {
            height: 45px;
            width: 120px;
            border: none;
            border: 20px;
            border-radius: 20px;
            background-color: red;
            color: white;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <button id="btn" onclick="displayModal()">Click</button>

    <div id="modal">
        <h2>Modal Window</h2>
        <p>This is Sample Modal Dialog.</p>
        <button id="btn-close" onclick="closeModal()">Close</button>
    </div>

    <script>

        function displayModal()
        {
            document.getElementById('modal').style.display="flex";
        }
        function closeModal()
        {
            document.getElementById('modal').style.display="none";
        }
    </script>
</body>
</html>
